name: desktop

on:
  push:
    branches: [master, main, v2]
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install shell workspace (tooling only)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm --filter @deepseek-ai/dsh-desktop exec vitest run

      - name: Build shell
        run: pnpm run build

      - name: Upstream contract gate
        run: node --import tsx scripts/verify-upstream-contract.ts

      - name: Stage official runtime from npm
        run: node --import tsx apps/desktop/scripts/stage-runtime.ts

      - name: Boot-check staged Host
        run: node --import tsx scripts/boot-check-host.ts

      - name: Package unpacked app
        run: pnpm --filter @deepseek-ai/dsh-desktop run package
