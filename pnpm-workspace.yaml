packages:
  - apps/*
  # NOTE: apps/desktop/runtime is intentionally NOT a workspace member. Its
  # package.json is a pure npm pin manifest — stage-runtime.ts copies it into
  # the staging directory and installs it standalone (--ignore-workspace),
  # so the workspace itself never hosts the official runtime closure.

  # The official runtime is consumed as published npm packages, not as
  # vendored sources. `apps/desktop/runtime/package.json` pins the exact
  # upstream versions the shell was validated against.
linkWorkspacePackages: false

overrides:
  # app-builder-lib 26.15.3 reads a cache-mode export introduced in 3.1.0,
  # while its declared range still permits the incompatible 3.0.0 release.
  'app-builder-lib@26.15.3>@electron/get': '3.1.0'

# pnpm 10+ blocks any dependency shipping an install/build script until it is
# explicitly reviewed here (strictDepBuilds defaults to true). electron-builder
# resolves the optional Squirrel target even though this app does not select
# it — its install script only copies a bundled 7-Zip binary, so we deny it.
allowBuilds:
  esbuild: true
  electron: true
  electron-winstaller: false
  node-pty: true
  koffi: true
  # macOS spawn helper postinstall (restores the executable bit).
  '@deepseek-ai/dsh-subprocess-local': true
  # Pulled in by pi-ai (optional LLM API backend); their lifecycle scripts
  # are no-ops we don't need.
  '@google/genai': false
  protobufjs: false

patchedDependencies:
  app-builder-lib@26.15.3: patches/app-builder-lib@26.15.3.patch
